name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build everything but skip GitHub Release, store uploads, and Pages deploy'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Require main for live releases
        if: ${{ github.ref != 'refs/heads/main' && !inputs.dry_run }}
        run: |
          echo "Live releases must run on main. Re-run with dry_run enabled to test this branch."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Sanity checks
        id: meta
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
            exit 1
          fi

          ANDROID_VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -n 1)
          if [ "$ANDROID_VERSION" != "$VERSION" ]; then
            echo "Android versionName '${ANDROID_VERSION}' does not match package.json version '${VERSION}'"
            exit 1
          fi

          IOS_VERSION=$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);/\1/p' ios/App/App.xcodeproj/project.pbxproj | head -n 1)
          if [ "$IOS_VERSION" != "$VERSION" ]; then
            echo "iOS MARKETING_VERSION '${IOS_VERSION}' does not match package.json version '${VERSION}'"
            exit 1
          fi

      - name: Generate release notes
        run: pnpm release-notes

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-artifacts/

  build-web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web
        run: pnpm build

      - name: Zip web build
        run: zip -r "fate-core-web-v${{ needs.prepare.outputs.version }}.zip" dist

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload web zip
        uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: fate-core-web-v${{ needs.prepare.outputs.version }}.zip

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Sync Android project
        run: pnpm build:android:ci

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n' | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Build signed Android release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Rename Android artifacts
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cp android/app/build/outputs/bundle/release/app-release.aab "fate-core-v${VERSION}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "fate-core-v${VERSION}.apk"

      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: fate-core-v${{ needs.prepare.outputs.version }}.aab

      - name: Upload Android apk
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: fate-core-v${{ needs.prepare.outputs.version }}.apk

  build-ios:
    needs: prepare
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Sync iOS project
        run: pnpm build:ios:ci

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive iOS app
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export IPA
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Rename IPA
        run: cp "$RUNNER_TEMP/export/"*.ipa "fate-core-v${{ needs.prepare.outputs.version }}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: fate-core-v${{ needs.prepare.outputs.version }}.ipa

  github-release:
    needs: [prepare, build-web, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Commit changelog
        id: changelog
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        run: |
          cp artifacts/release-notes/CHANGELOG.md CHANGELOG.md
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: changelog for v${{ needs.prepare.outputs.version }}"
            git push
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ steps.changelog.outputs.commit }}
          body_path: artifacts/release-notes/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            artifacts/android-apk/fate-core-v${{ needs.prepare.outputs.version }}.apk
            artifacts/android-bundle/fate-core-v${{ needs.prepare.outputs.version }}.aab
            artifacts/ios-ipa/fate-core-v${{ needs.prepare.outputs.version }}.ipa
            artifacts/web-zip/fate-core-web-v${{ needs.prepare.outputs.version }}.zip
